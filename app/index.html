<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tenly">
<meta name="theme-color" content="#f2f4f8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Tenly — прототип приложения</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#fffaf3;--card:#fcf1e2;--text:#133331;--muted:#6f6a5e;--muted2:#a89e8c;--line:#efe2cf;
  --pri:#133331;--pri2:#1f4a46;--pri-soft:#f5e7d2;--ball:#f6ddb9;--ball-d:#bda26d;--gold:#bda26d;--brown:#8a6a3d;
  --ok:#16a34a;--ok-soft:#dcfce7;--warn:#d97706;--warn-soft:#fef3c7;--bad:#dc2626;--bad-soft:#fee2e2;
  --r:18px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#dfe4ee;color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- stage (desktop) ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:20px;
  background:radial-gradient(1200px 600px at 80% -10%,#c6d9f3 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#e3f0b8 0,transparent 55%),#e7ecf3}
.panel{width:360px;max-height:calc(100vh - 40px);overflow:auto;padding:4px 4px 20px}
.panel .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.panel .brand .logo{height:64px;width:auto}
.panel h2{font-size:22px;line-height:1.2;margin:0}
.panel .sub{color:var(--muted);font-size:14px;margin:4px 0 18px}
.panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.role-card{display:flex;gap:12px;align-items:flex-start;width:100%;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;border:2px solid transparent;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.role-card.on{border-color:var(--pri)}
.role-card .ri{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.role-card b{display:block;font-size:15px}
.role-card span{font-size:13px;color:var(--muted)}
.tips{background:#fff;border-radius:16px;padding:12px 16px;font-size:13.5px;line-height:1.45}
.tips ol{margin:0;padding-left:18px}
.tips li{margin:4px 0}
.seg-mini{display:flex;background:#fff;border-radius:12px;padding:3px;gap:3px}
.seg-mini button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;color:var(--muted)}
.seg-mini button.on{background:var(--pri);color:#fff}
.panel-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:#fff;font-weight:600;font-size:14px}
.pbtn.dark{background:var(--text);color:#fff}
.small-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}

/* ---------- phone ---------- */
.phone{width:393px;height:852px;flex-shrink:0;border-radius:60px;background:#101114;padding:11px;position:relative;
  box-shadow:0 0 0 2px #2b2d33,0 40px 80px -20px rgba(15,23,42,.45),inset 0 0 0 1px #000}
.screen{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 38px;font-weight:600;font-size:16px;position:relative;z-index:30}
.statusbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:60;pointer-events:none}
.demo-fab{display:none}

@media (max-width:600px){
  body{background:var(--bg)}
  .stage{display:block;padding:0;background:var(--bg)}
  .panel{display:none}
  .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .statusbar,.homebar{display:none}
  .screen{padding-top:env(safe-area-inset-top)}
  .demo-fab{display:flex;position:fixed;right:0;top:42%;z-index:200;writing-mode:vertical-rl;transform:rotate(180deg);
    background:var(--text);color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;padding:12px 7px;border-radius:0 10px 10px 0;opacity:.85}
}

/* ---------- views ---------- */
.view{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.view.push{animation:push .28s cubic-bezier(.2,.8,.2,1)}
.view.pop{animation:pop .24s ease-out}
@keyframes push{from{transform:translateX(40%);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateX(-12%);opacity:.5}to{transform:none;opacity:1}}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.no-tab{padding-bottom:40px}
.lg-head{padding:6px 4px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lg-head h1{font-size:32px;line-height:1.1;margin:0;letter-spacing:-.02em}
.lg-head .hsub{font-size:14px;color:var(--muted);margin-bottom:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.navbar{height:46px;flex-shrink:0;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 8px}
.navbar .back{display:flex;align-items:center;gap:2px;color:var(--pri);font-size:17px;padding:6px}
.navbar .back svg{width:24px;height:24px}
.navbar .ttl{text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .act{justify-self:end;color:var(--pri);font-weight:600;font-size:17px;padding:6px}

.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec-t h3{font-size:20px;margin:0;letter-spacing:-.01em}
.sec-t a,.sec-t button{color:var(--pri);font-size:15px;font-weight:500}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.fs13{font-size:13px}.fs14{font-size:14px}.fs15{font-size:15px}.b{font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-weight:600;font-size:16px;width:100%;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:#fff}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.dark{background:var(--text);color:#fff}
.btn.sm{height:38px;font-size:14px;border-radius:11px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:17px;background:#fff;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--text);color:#fff;box-shadow:none}
.chip svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:#f1f5f9;color:#334155;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.lv{background:var(--ball);color:#3d4a07}
.tag.ok{background:var(--ok-soft);color:#166534}
.tag.warn{background:var(--warn-soft);color:#92400e}
.tag.bad{background:var(--bad-soft);color:#991b1b}
.tag.pri{background:var(--pri-soft);color:var(--pri)}
.tag.dark{background:var(--text);color:#fff}

.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar.lg{width:64px;height:64px;font-size:22px}
.av-stack{display:flex}
.av-stack .avatar{border:2px solid #fff;margin-left:-8px}
.av-stack .avatar:first-child{margin-left:0}

/* training card */
.tr{display:flex;gap:12px;width:100%;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;align-items:stretch;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tr-time{width:52px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--line);padding-right:10px}
.tr-time b{font-size:17px;letter-spacing:-.01em}
.tr-time span{font-size:12px;color:var(--muted);margin-top:2px}
.tr-time .dd{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;margin-bottom:2px}
.tr-main{flex:1;min-width:0}
.tr-title{font-weight:650;font-size:15.5px;line-height:1.25;display:flex;align-items:center;gap:6px}
.tr-meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tr-price{text-align:right;font-weight:700;font-size:15px;white-space:nowrap;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.tr-price small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.tr.locked{opacity:.55}
.tr.locked .tr-title{color:var(--muted)}
.grp-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between}
.grp-h:first-child{margin-top:6px}

/* hero next training */
.hero{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 60%,#2464b3 0 62%,#3b80cc 62.4%);}
.hero:before{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.18) 49.6% 50.4%,transparent 50.4%),
  linear-gradient(0deg,transparent 30%,rgba(255,255,255,.14) 30% 30.8%,transparent 30.8%);pointer-events:none}
.hero .ball{position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:linear-gradient(145deg,#ecf77a,#c4dc2a);opacity:.95}
.hero .ball:after{content:"";position:absolute;inset:14px;border-radius:50%;border:4px solid rgba(255,255,255,.35);clip-path:inset(0 50% 0 0)}
.hero .lbl{font-size:13px;font-weight:600;opacity:.8;position:relative}
.hero .when{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:4px;position:relative;line-height:1.2}
.hero:has(.emb) .lbl,.hero:has(.emb) .when,.hero:has(.emb) .what{padding-right:74px}
.hero .what{font-size:16px;font-weight:600;margin-top:2px;position:relative}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;opacity:.9;margin-top:12px;position:relative}
.hero .meta span{display:flex;align-items:center;gap:5px}
.hero .meta svg{width:16px;height:16px}
.hero .cd{position:relative;display:inline-flex;margin-top:14px;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.hero .acts{display:flex;gap:8px;margin-top:14px;position:relative}
.hero .acts .btn{height:42px;font-size:14.5px}
.hero .acts .w{background:#fff;color:var(--pri)}
.hero .acts .t{background:rgba(255,255,255,.16);color:#fff}

.paybox{border-radius:18px;padding:14px 16px;background:#fff7e6;border:1px solid #fde4b0;margin-top:12px}
.paybox .pt{display:flex;gap:10px;align-items:flex-start}
.paybox .pi{width:36px;height:36px;border-radius:10px;background:#fde68a;color:#92400e;display:grid;place-items:center;flex-shrink:0}
.paybox b{font-size:15px}
.paybox .amt{font-size:26px;font-weight:800;letter-spacing:-.02em}
.paybox.done{background:var(--ok-soft);border-color:#bbf7d0}
.paybox.done .pi{background:#bbf7d0;color:#166534}

.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.mini{flex:0 0 220px;scroll-snap-align:start;background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.mini .d{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase}
.mini .t{font-weight:650;font-size:15px;line-height:1.25}

.list{background:#fff;border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;position:relative;min-height:54px}
.li + .li:before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.list.plain .li + .li:before{left:16px}
.li .lic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);flex-shrink:0}
.li .lic svg{width:18px;height:18px}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-weight:550;font-size:15.5px}
.li .lt span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.li .lr{color:var(--muted2);display:flex;align-items:center;gap:6px;font-size:14px}
.li .lr svg{width:18px;height:18px}

.seg{display:flex;background:#e4e6ec;border-radius:11px;padding:2px;margin:0 0 12px}
.balrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;color:var(--muted2)}
.balrow .lic{width:40px;height:40px;border-radius:12px;background:var(--ball);color:#3d4a07;display:grid;place-items:center}
.balrow .lt{flex:1;min-width:0;color:var(--text)}
.balrow small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.balrow b{font-size:20px;letter-spacing:-.01em}
.inv{background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.inv-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.inv-row:last-child{border-bottom:0}
.inv-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.inv-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:2px solid var(--text)}
.inv-tot b{font-size:26px;letter-spacing:-.02em}
.qbtn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);margin-left:6px;vertical-align:middle;cursor:pointer}
.qbtn svg{width:15px;height:15px}
.ntrp-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ntrp-row:last-child{border-bottom:0}
.ntrp-row b.n{flex:0 0 38px;font-size:17px;color:var(--pri)}
.msg{background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.msg.unread{box-shadow:inset 3px 0 0 var(--pri),0 1px 2px rgba(15,23,42,.04)}
.msg .mh{display:flex;gap:10px;align-items:flex-start}
.msg .mi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--pri-soft);color:var(--pri)}
.att{display:flex;gap:6px;margin-top:8px}
.att button{flex:1;height:34px;border-radius:10px;font-size:13.5px;font-weight:600;background:#f1f5f9;color:#475569;display:flex;align-items:center;justify-content:center;gap:4px}
.att button svg{width:15px;height:15px}
.att button.on.yes{background:var(--ok);color:#fff}
.att button.on.no{background:var(--bad);color:#fff}
.tr-price .pp{background:var(--pri);color:#fff;border-radius:9px;padding:4px 9px;font-size:14px}
.seg .sdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:3px;vertical-align:middle}
.seg button{flex:1;text-align:center;padding:7px 2px;font-size:13px;white-space:nowrap;font-weight:600;border-radius:9px;color:#334155}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:var(--text)}

.stickyhead{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:2px;margin:0 -16px;padding-left:16px;padding-right:16px}

/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:6px 8px 26px;display:flex;justify-content:space-around;z-index:20;
  background:rgba(249,250,252,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(0,0,0,.07)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#8a93a3;position:relative}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--pri)}
.tabbar .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
@media (max-width:600px){.tabbar{height:calc(58px + env(safe-area-inset-bottom));padding-bottom:calc(6px + env(safe-area-inset-bottom))}}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.38);z-index:80}
.backdrop.anim{animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:81;background:var(--bg);border-radius:22px 22px 0 0;max-height:88%;display:flex;flex-direction:column}
.sheet.anim{animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#cbd5e1;margin:8px auto 2px;flex-shrink:0}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 6px;flex-shrink:0}
.sheet .sh-h h3{margin:0;font-size:19px}
.sheet .sh-b{overflow-y:auto;padding:6px 16px 34px}
.x-btn{width:30px;height:30px;border-radius:50%;background:#e4e6ec;display:grid;place-items:center;color:#475569}
.x-btn svg{width:16px;height:16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt.on{box-shadow:inset 0 0 0 2px var(--pri);background:#f8faff}
.opt.dis{opacity:.5;pointer-events:none}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.opt.on .rd{border-color:var(--pri);background:var(--pri)}
.opt.on .rd:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt .ot{flex:1}
.opt .ot b{font-size:15.5px}
.opt .ot p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.opt .op{font-weight:800;font-size:17px;white-space:nowrap}

.toast{position:absolute;left:16px;right:16px;bottom:100px;z-index:120;background:rgba(15,23,42,.94);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:center}

/* forms */
.field{background:#fff;border-radius:14px;padding:8px 14px;margin-bottom:8px}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f2 .field{margin-bottom:0}
.f-group{margin-bottom:8px}
.switch{position:relative;width:51px;height:31px;flex-shrink:0}

.switch span:before{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}

.ob{flex:1;display:flex;flex-direction:column;padding:10px 24px 34px;min-height:0;overflow-y:auto}

.lang.on{box-shadow:inset 0 0 0 2px var(--pri)}
.lang .fl{font-size:26px}

@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.rating-ball span{font-size:44px;font-weight:800;color:#26310a;font-family:Raleway,sans-serif;letter-spacing:-.03em}
.rating-ball:after{content:"";position:absolute;inset:10px;border-radius:50%;border:4px solid rgba(255,255,255,.7);clip-path:inset(0 0 0 55%)}

.cal{background:#fff;border-radius:var(--r);padding:12px 10px 8px}
.cal-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px}
.cal-h b{font-size:17px}
.cal-h .arr{display:flex;gap:4px}

.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:2px}

.detail-hero{background:#fff;border-radius:22px;padding:18px}

.spots{display:flex;gap:4px;margin-top:8px}

.success .ok svg{width:50px;height:50px;stroke-width:2.6}
@keyframes pop2{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.cardviz{border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#334155,#0f172a);height:120px;display:flex;flex-direction:column;justify-content:space-between}

function fzDefaults(tplId){const nx=instancesRange(28).find(x=>x.t.id===tplId);const from=nx?nx.start:T0;return{from:ymd(from),to:ymd(addD(from,29))}}
/* subscriptions are billed by calendar month: the next payment is for the next month, due on its 1st day */
const nextMonthStart=()=>new Date(T0.getFullYear(),T0.getMonth()+1,1);

const lvDate=d=>`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
function monthDates(t,y,m,from){const out=[];const last=new Date(y,m+1,0).getDate();for(let d=1;d<=last;d++){const dt=new Date(y,m,d);if(wdi(dt)===t.weekday&&(!from||ymd(dt)>=from))out.push(ymd(dt))}return out}
const isClosed=ds=>D.closures.some(c=>ds>=c.from&&ds<=c.to);
function monthBill(t,u,y,m,from){const all=monthDates(t,y,m);const dates=monthDates(t,y,m,from).filter(ds=>!isClosed(ds)&&!(t.since&&t.since[u]>ds)&&!(t.until&&t.until[u]<ds));const fz=D.freezes.filter(f=>f.tpl===t.id&&f.uid===u);
  const active=dates.filter(ds=>!fz.some(f=>ds>=f.from&&ds<=f.to));
  const sinceU=from||(t.since&&t.since[u]);const lateJoin=!!(sinceU&&all.length&&sinceU>all[0]&&sinceU<=all.at(-1)); // joined after the 1st session → single price per session (max = month price)
  return{all,dates,active,frozen:dates.length-active.length,lateJoin,amount:lateJoin?Math.min(t.month,active.length*t.price):Math.round(t.month*active.length/Math.max(1,all.length))}}
const ymKey=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
function abonPaid(u,tid,y,m){const nm=nextMonthStart();if(u==='p1'&&tid==='t5'&&y===nm.getFullYear()&&m===nm.getMonth())return S.renewPaid;return !!D.abonPaid[`${u}|${tid}|${ymKey(y,m)}`]}
function setAbonPaid(u,tid,y,m,inv){const nm=nextMonthStart();if(u==='p1'&&tid==='t5'&&y===nm.getFullYear()&&m===nm.getMonth())S.renewPaid=true;D.abonPaid[`${u}|${tid}|${ymKey(y,m)}`]=inv||true}
function monthMembers(t,y,m){const a=ymd(new Date(y,m,1)),b=ymd(new Date(y,m+1,0));return t.members.filter(u=>!(t.since&&t.since[u]>b)&&!(t.until&&t.until[u]<a))}
const assignedGroup=u=>u&&u.hidden!=null&&catOf(u.hidden)!==catOf(u.self);

function abonDebt(u,t,y,m){const b=monthBill(t,u,y,m);if(!b.active.length||abonPaid(u,t.id,y,m))return null;
  const mm=D.memberships.find(x=>x.tpl===t.id&&x.uid===u&&x.pay==='cash'&&!x.paid&&x.since.slice(0,7)===ymKey(y,m));if(mm)return null;
  return{id:`C:${u}|${t.id}|${ymKey(y,m)}`,pid:u,title:`Абонемент за ${MN[m].toLowerCase()}: ${t.title}`,detail:`${b.active.length} ${plural(b.active.length,'занятие','занятия','занятий')} · ${WD[t.weekday]} ${t.time} · не оплачен`,amount:b.amount,tpl:t.id,y,m}}
function debtById(id){const d=debts().find(d=>d.id===id);if(d)return d;if(id.startsWith('C:')){const[u,tid,ym]=id.slice(2).split('|');const[y,mo]=ym.split('-').map(Number);const t=tpl(tid);return t&&abonDebt(u,t,y,mo-1)}return null}
function abonInvoice(u,t,y,m,method,extra={}){const b=monthBill(t,u,y,m);

function instancesRange(days=56){
  const out=[];const now=new Date();
  for(let i=0;i<days;i++){
    const d=addD(T0,i);const w=wdi(d);const ds=ymd(d);
    if(D.closures.some(c=>ds>=c.from&&ds<=c.to))continue;
    for(const t of D.tpls){
      if(t.deleted)continue;
      if(t.repeat?t.weekday!==w:t.date!==ds)continue;
      const[h,m]=t.time.split(':').map(Number);const start=new Date(d);start.setHours(h,m);
      if(start<now||D.cancelledInst[t.id+'_'+ds])continue;
      out.push(mkInst(t,start));
    }
  }
  return out.sort((a,b)=>a.start-b.start);
}
function mkInst(t,start){
  const id=t.id+'_'+ymd(start);
  const ds0=ymd(start);const members=t.members.filter(u=>memOn(t,u,ds0)).length;
  const free0=Math.max(0,t.cap-members);
  const h=hash(id);
  let base=Math.floor((h%100)/100*free0*0.75);
  const ahead=dayDiff(start);if(ahead>14)base=Math.floor(base*0.4); // fewer single bookings far ahead
  if(h%9===0&&ahead<=14)base=free0;
  if(t.custom)base=0; // groups created by the admin start empty
  base=Math.min(base,free0);
  const singles=D.bookings.filter(b=>b.inst===id&&!b.cancelled);
  const absent=new Set([...D.absences.filter(a=>a.inst===id).map(a=>a.uid),...frozenUids(t,ymd(start)).filter(u=>t.members.includes(u))]).size;
  const kicked=(D.kicked[id]||[]).length;
  const held=D.waitlist.filter(w=>w.type==='single'&&w.ref===id&&offerActive(w)).length;
  const left=Math.max(0,free0-base-singles.length+absent+kicked-held);
  return {id,t,start,end:new Date(+start+t.dur*6e4),left,taken:t.cap-left,base,singles,permFree:Math.max(0,t.perm-t.members.filter(u=>!(t.until&&t.until[u]<ds0)).length-D.waitlist.filter(w=>w.type==='perm'&&w.ref===t.id&&offerActive(w)).length)};
}
const instById=id=>{const[tid,ds]=id.split('_');const t=tpl(tid);if(!t)return null;const[h,m]=t.time.split(':').map(Number);const s=pYmd(ds);s.setHours(h,m);return mkInst(t,s)};

function userState(x,u=me()){
  if(!u)return{};
  const r=eff(u);

  const absent=frozen||D.absences.some(a=>a.inst===x.id&&a.uid===u.id);

}

/* ---------- filtering / grouping for schedule ---------- */
const tod=d=>d.getHours()<12?'morning':d.getHours()<17?'day':'evening';
const TOD={morning:'Утро',day:'День',evening:'Вечер'};
function filtered(list){
  const f=S.sched;
  return list.filter(x=>{
    if(f.mine&&userState(x).locked)return false;
    if(f.coaches.length&&!f.coaches.includes(x.t.coach))return false;
    if(f.durs.length&&!f.durs.includes(x.t.dur))return false;
    if(f.tods.length&&!f.tods.includes(tod(x.start)))return false;
    if(f.kinds.length&&!f.kinds.includes(x.t.level))return false;
    if(f.permOnly&&!x.permFree)return false;
    return true;
  });
}
function sorted(list){
  const s=S.sched.sort;
  const a=[...list];
  if(s==='price')a.sort((x,y)=>x.t.price-y.t.price||x.start-y.start);
  else if(s==='spots')a.sort((x,y)=>(y.left>0)-(x.left>0)||x.start-y.start);
  else if(s==='level')a.sort((x,y)=>x.t.lvMin-y.t.lvMin||x.start-y.start);
  else a.sort((x,y)=>x.start-y.start);
  return a;
}
const GROUPS={day:'Дню',coach:'Тренеру',level:'Уровню группы',dur:'Длительности',tod:'Времени суток',none:'Без группировки'};
const SORTS={time:'По времени',price:'По цене',spots:'Сначала свободные',level:'По уровню'};
function grouped(list){
  const g=S.sched.group;
  if(g==='none')return[{k:'',label:'',items:sorted(list)}];
  const map=new Map();
  for(const x of list){
    let k,label,ord;
    if(g==='day'){k=ymd(x.start);label=relDay(x.start)+(dayDiff(x.start)<3?` · ${WD[wdi(x.start)]}, ${dShort(x.start)}`:'');ord=+x.start}
    else if(g==='coach'){k=x.t.coach;label=coach(k).name;ord=k}
    else if(g==='level'){k=x.t.level;label=`${CATS[k].name} · NTRP ${lvRange(x.t)}`;ord=Object.keys(CATS).indexOf(k)}
    else if(g==='dur'){k=x.t.dur;label=`${k} минут`;ord=k}
    else {k=tod(x.start);label=TOD[k];ord=['morning','day','evening'].indexOf(k)}
    if(!map.has(k))map.set(k,{k,label,ord,items:[]});
    map.get(k).items.push(x);
  }
  return[...map.values()].sort((a,b)=>a.ord<b.ord?-1:a.ord>b.ord?1:0).map(gr=>({...gr,items:sorted(gr.items)}));
}

const navbar=(title,act='')=>`<div class="navbar"><button class="back" data-a="back">${ic('chevL')}Назад</button><div class="ttl">${esc(title)}</div><div>${act}</div></div>`;

/* ---------- training card ---------- */
function trCard(x,opts={}){
  const st=userState(x);const c=coach(x.t.coach);
  const showDate=opts.showDate;
  let spotsTag='';
  if(st.member)spotsTag=st.frozen?`<span class="tag pri">${ic('snow')}Заморожено</span>`:st.absent?'<span class="tag warn">Вы отметили «не приду»</span>':'<span class="tag pri">'+ic('repeat')+'Ваша группа</span>';
  else if(st.booking)spotsTag=`<span class="tag ok">${ic('check')}Вы записаны</span>`;
  else if(st.offerS||st.offerP)spotsTag=`<span class="tag warn">${ic('hourglass')}Место за вами до ${hm(new Date((st.offerS||st.offerP).offerUntil))}</span>`;else if(st.locked)spotsTag=`<span class="tag">${ic('lock')}Не ваш уровень</span>`;
  else if(x.left===0)spotsTag='<span class="tag bad">Мест нет</span>';
  else spotsTag='<span class="tag ok">Есть места</span>';
  const permTag=!st.member&&!st.locked&&x.t.month&&x.permFree?`<span class="tag pri">${ic('repeat')}Пост. место</span>`:'';
  return `<button class="tr ${st.locked?'locked':''}" data-a="openTr" data-id="${x.id}">
    <div class="tr-time">${showDate?`<span class="dd">${WD[wdi(x.start)]} ${x.start.getDate()}</span>`:''}<b>${hm(x.start)}</b><span>${x.t.dur} мин</span></div>
    <div class="tr-main"><div class="tr-title">${esc(x.t.title)}</div>
      <div class="tr-meta">${coachAv(c)}${esc(c.short)} · ${esc(x.t.court)}</div>
      <div class="tr-tags"><span class="tag lv">NTRP ${lvRange(x.t)}</span>${spotsTag}${permTag}</div></div>
    <div class="tr-price">${!st.locked&&!st.mine&&(x.left>0||st.offerS)?`<span class="pp" data-a="quickBook" data-id="${x.id}">${eur(x.t.price)}</span>`:eur(x.t.price)}${x.t.month?`<small>или €${fmtE(x.t.month)}/мес</small>`:''}</div>
  </button>`;
}

SCREENS.schedule=()=>{
  const f=S.sched;
  const all=instancesRange(f.view==='cal'?56:14);
  const list=filtered(all);
  const nF=f.coaches.length+f.durs.length+f.tods.length+f.kinds.length+(f.permOnly?1:0);
  const head=`<div class="stickyhead">
    <div class="seg"><button class="${f.view==='list'?'on':''}" data-a="sView" data-v="list">Список</button><button class="${f.view==='cal'?'on':''}" data-a="sView" data-v="cal">Календарь</button></div>
    <div class="chips">
      <button class="chip ${nF?'on':''}" data-a="sheet" data-n="filters">${ic('filter')}Фильтры${nF?` · ${nF}`:''}</button>
      <button class="chip ${f.mine?'on':''}" data-a="sMine">${f.mine?ic('check'):''}Моя группа: ${CATS[catOf(eff(me()))].short}</button>
      ${f.view==='list'?`<button class="chip" data-a="sheet" data-n="group">${ic('layers')}По ${GROUPS[f.group].toLowerCase()}</button>`:''}
      <button class="chip" data-a="sheet" data-n="sort">${ic('sort')}${SORTS[f.sort]}</button>
    </div></div>`;
  let body='';
  if(f.view==='list'){
    const gs=grouped(list);
    body=list.length?gs.map(g=>`${g.label?`<div class="grp-h"><span>${esc(g.label)}</span><span>${g.items.length}</span></div>`:''}${g.items.map(x=>trCard(x,{showDate:f.group!=='day'})).join('')}`).join('')
      :`<div class="empty"><div class="ei">${ic('search',26)}</div>Нет тренировок по выбранным фильтрам<br><button class="btn sec sm mt12" style="margin:12px auto 0" data-a="sReset">Сбросить фильтры</button></div>`;
    if(f.mine){const hidden=all.filter(x=>userState(x).locked).length;if(hidden)body+=`<button class="note mt12" data-a="sMine" style="width:100%;text-align:left">${ic('lock')}<div>Скрыто ${hidden} ${plural(hidden,'тренировка','тренировки','тренировок')} другого уровня. <b>Показать</b></div></button>`}
  }else{
    const m=f.month;const first=new Date(m);const startPad=wdi(first);
    const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    const byDay={};list.forEach(x=>{const k=ymd(x.start);(byDay[k]=byDay[k]||[]).push(x)});
    let cells='';
    for(let i=0;i<startPad;i++)cells+='<div class="cal-d out"></div>';
    for(let d=1;d<=dim;d++){
      const dt=new Date(m.getFullYear(),m.getMonth(),d);const k=ymd(dt);const items=byDay[k]||[];

      const cl=D.closures.some(c=>k>=c.from&&k<=c.to);
      cells+=`<button class="cal-d ${past?'past':''} ${k===ymd(T0)?'today':''} ${k===f.sel?'sel':''}" data-a="sDay" data-d="${k}" ${cl?'style="text-decoration:line-through;color:#cbd5e1"':''}>${d}<span class="dots">${my?'<i class="my"></i>':''}${items.slice(0,my?2:3).map(()=>'<i></i>').join('')}</span></button>`;
    }
    const selItems=sorted(byDay[f.sel]||[]);
    const canPrev=m>new Date(T0.getFullYear(),T0.getMonth(),1);

function participants(x){
  const fzu=frozenUids(x.t,ymd(x.start));
  const ids=[...x.t.members.filter(m=>memOn(x.t,m,ymd(x.start))&&!fzu.includes(m)&&!D.absences.some(a=>a.inst===x.id&&a.uid===m))];
  let pool=D.players.filter(p=>!x.t.members.includes(p.id)&&p.id!=='p1'&&p.id!==S.newUid);
  const fit=pool.filter(p=>eff(p)>=x.t.lvMin&&eff(p)<=x.t.lvMax);pool=fit;
  const h=hash(x.id);
  if(pool.length)for(let i=0;i<x.base;i++)ids.push(pool[(h+i)%pool.length].id);
  x.singles.forEach(b=>{if(!ids.includes(b.uid))ids.push(b.uid)});
  const kk=D.kicked[x.id]||[];
  return [...new Set(ids)].filter(u=>!kk.includes(u)).map(player).filter(Boolean);
}

function sessionPay(x,pl){ // payment status + pending debt id for one participant of a session
  const isMem=memOn(x.t,pl.id,ymd(x.start));const b=x.singles.find(b=>b.uid===pl.id);
  const mm=isMem&&D.memberships.find(m=>m.tpl===x.t.id&&m.uid===pl.id&&m.pay==='cash'&&!m.paid);
  if(mm)return{isMem,due:'M:'+mm.inv,amount:mm.firstAmount??x.t.month,label:'Абонемент'};
  if(isMem&&pl.id==='p1'&&x.t.id==='t5'&&payPending(pl.id))return{isMem,due:'A:p1',amount:debts('p1').find(d=>d.id==='A:p1').amount,label:'Абонемент'};
  if(isMem)return{isMem,ok:'Абонемент оплачен'};
  if(b&&b.pay==='credit'){if(b.extra&&b.extraPay==='cash'&&!D.cashGot[b.id])return{isMem,due:'B:'+b.id,amount:b.extra,label:`Отыгрыш ${fmtH(b.useH)} + доплата`};return{isMem,ok:`Отыгрыш ${fmtH(b.useH)}${b.extra?` + €${fmtE(b.extra)}`:''}`}}
  if(b&&b.pay==='cash'){if(!D.cashGot[b.id])return{isMem,due:'B:'+b.id,amount:x.t.price,label:'Разовое'};return{isMem,ok:'Оплачено на месте'}}
  if(b)return{isMem,ok:'Оплачено картой'};
  return{isMem,ok:hash(pl.id+x.id)%5===0?'Оплачено на месте':'Оплачено картой'};
}

  const yes=parts.filter(pl=>att[pl.id]===true).length,no=parts.filter(pl=>att[pl.id]===false).length;

};

  const permFree=D.tpls.filter(t=>!t.deleted).reduce((a,t)=>a+Math.max(0,t.perm-t.members.length),0);
  return `<div class="content" data-scroll="ah">${lgHead('Обзор',`${longDay(new Date())} · Администратор`,`<button class="icon-btn" data-a="go" data-n="inbox">${ic('bell')}${unread()?'<span class="dot"></span>':''}</button>`)}
    <div class="row" style="margin-bottom:12px"><button class="btn pri sm" style="flex:1" data-a="go" data-n="aMsg">${ic('bell',16)}Уведомление</button><button class="btn sec sm" style="flex:1" data-a="go" data-n="aClosed">${ic('cal',16)}Нерабочие дни</button></div>
    <div class="kpis">
      <div class="kpi"><small>Заполненность недели</small><b>${fill}%</b><div class="bar"><i style="width:${fill}%"></i></div></div>
      <div class="kpi"><small>Тренировок за 7 дней</small><b>${wk.length}</b><span class="muted">${today.length} сегодня</span></div>

      <div class="kpi"><small>Свободных пост. мест</small><b>${permFree}</b><span class="muted">в ${D.tpls.filter(t=>!t.deleted&&t.perm>t.members.length).length} группах</span></div>
    </div>
    <div class="sec-t"><h3>Последние действия</h3><button data-a="go" data-n="aAudit">Журнал</button></div>
    <div class="list">${D.audit.slice(0,4).map(a=>`<button class="li" data-a="go" data-n="aAudit"><div class="lt"><b>${esc(a.action)}</b><span>${esc(a.who)}${a.text?' · '+esc(a.text):''}</span></div><span class="fs13 muted" style="white-space:nowrap">${fmtAt(a.at)}</span></button>`).join('')}</div>
    <div class="sec-t"><h3>Запросы</h3><span class="muted fs14">${D.requests.length}</span></div>
    ${D.requests.length?D.requests.map(r=>{const p=player(r.pid);const title={level:'Изменить уровень',access:'Допуск в группу',freeze:'Заморозка места'}[r.type];
      const sub=r.type==='level'?`${esc(coach(r.from).name)} предлагает ${fmtR(eff(p))} → <b style="color:var(--text)">${fmtR(r.to)}</b>`:r.type==='freeze'?`${esc(tpl(r.tpl).title)} · ${WD[tpl(r.tpl).weekday]} ${tpl(r.tpl).time} · <b style="color:var(--text)">${fzRange(r.from,r.to)}</b>`:`${esc(tpl(r.tpl).title)} (NTRP ${lvRange(tpl(r.tpl))}), уровень игрока ${fmtR(eff(p))}`;
      return `<div class="card" style="margin-bottom:8px"><div class="row">${av(p.name,colorOf(p.id),'')}<div style="flex:1"><b>${title}: ${esc(p.name)}</b><div class="fs13 muted">${sub}</div></div>${r.type==='freeze'?`<span class="tag pri">${ic('snow')}</span>`:''}</div>
      <div class="fs14 mt8" style="line-height:1.4">«${esc(r.note)}»</div>

    <div class="sec-t"><h3>Сегодня</h3></div>

SCREENS.aTrain=()=>{
  const f=S.aTrain;const seg=S.aTrainSeg||'sched';
  const chips=`<div class="chips"><button class="chip ${f==='all'?'on':''}" data-a="aTrainF" data-v="all">Все тренеры</button>${D.coaches.map(c=>`<button class="chip ${f===c.id?'on':''}" data-a="aTrainF" data-v="${c.id}">${esc(c.short)}</button>`).join('')}</div>`;
  const segH=`<div class="seg"><button class="${seg==='sched'?'on':''}" data-a="aSeg" data-v="sched">Занятия</button><button class="${seg==='tpl'?'on':''}" data-a="aSeg" data-v="tpl">Группы</button></div>`;
  let body='';
  if(seg==='sched'){
    const list=instancesRange(14).filter(x=>f==='all'||x.t.coach===f);
    const m=new Map();list.forEach(x=>{const k=ymd(x.start);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
    body=[...m.entries()].map(([k,it])=>`<div class="grp-h"><span>${relDay(pYmd(k))}${dayDiff(pYmd(k))<3?' · '+dShort(pYmd(k)):''}</span><span>${it.length}</span></div>${it.map(x=>{const ps=participants(x);return `<button class="tr" data-a="go" data-n="cSession" data-id="${x.id}"><div class="tr-time"><b>${hm(x.start)}</b><span>${x.t.dur} мин</span></div><div class="tr-main"><div class="tr-title">${esc(x.t.title)}</div><div class="tr-meta">${coachAv(coach(x.t.coach))}${esc(coach(x.t.coach).short)} · ${esc(x.t.court)}</div><div class="tr-tags"><span class="tag ${ps.length>=x.t.cap?'ok':''}">${ic('users')}${ps.length}/${x.t.cap}</span><div class="av-stack">${ps.slice(0,5).map(p=>av(p.name,colorOf(p.id),'sm')).join('')}</div></div></div><div class="tr-price" style="justify-content:center;color:var(--muted2)">${ic('chevR')}</div></button>`}).join('')}`).join('');
  }else{
    const ts=D.tpls.filter(t=>!t.deleted&&(f==='all'||t.coach===f)).sort((a,b)=>(a.repeat?a.weekday:wdi(pYmd(a.date)))-(b.repeat?b.weekday:wdi(pYmd(b.date)))||a.time.localeCompare(b.time));
    const byDay=new Map();ts.forEach(t=>{const k=t.repeat?WDL[t.weekday]:'Разовые';if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(t)});
    body=[...byDay.entries()].map(([k,it])=>`<div class="grp-h"><span>${k}</span><span>${it.length}</span></div>${it.map(t=>`<button class="tr" data-a="go" data-n="aTplEdit" data-id="${t.id}"><div class="tr-time"><b>${t.time}</b><span>${t.dur} мин</span></div><div class="tr-main"><div class="tr-title">${esc(t.title)}</div><div class="tr-meta">${coachAv(coach(t.coach))}${esc(coach(t.coach).short)} · ${esc(t.court)}</div><div class="tr-tags"><span class="tag lv">NTRP ${lvRange(t)}</span><span class="tag pri">Пост. ${t.members.length}/${t.perm}</span><span class="tag">${eur(t.price)} · €${fmtE(t.month)}/мес</span></div></div><div class="tr-price" style="justify-content:center;color:var(--muted2)">${ic('edit')}</div></button>`).join('')}`).join('');
  }
  return `<div class="content" data-scroll="at${seg}">${lgHead('Тренировки','',`<button class="btn sec sm" data-a="go" data-n="aPrices">${ic('cash',16)}Цены</button>`)}${segH}${chips}${body}</div><button class="fab" data-a="go" data-n="aTplEdit" data-id="new">${ic('plus')}</button>`;
};

  const tchip=(key,val,label)=>`<button class="chip ${f[key].includes(val)?'on':''}" data-a="fT" data-k="${key}" data-v="${val}">${label}</button>`;
  switch(s.name){
  case 'filters':return hd('Фильтры')+`<div class="sh-b">
    <div class="grp-h">Тренер</div><div class="chips wrap">${D.coaches.map(c=>tchip('coaches',c.id,esc(c.short))).join('')}</div>

    <div class="list plain mt16"><div class="li"><div class="lt"><b>Только с постоянными местами</b></div><label class="switch"><input type="checkbox" ${f.permOnly?'checked':''} onchange="S.sched.permOnly=this.checked;render()"><span></span></label></div>
      <div class="li"><div class="lt"><b>Только мой уровень</b><span>Скрывать тренировки другого уровня</span></div><label class="switch"><input type="checkbox" ${f.mine?'checked':''} onchange="S.sched.mine=this.checked;render()"><span></span></label></div></div>
    <div class="row mt16"><button class="btn ghost" data-a="sReset">Сбросить</button><button class="btn pri" data-a="closeSheet">Показать ${filtered(instancesRange(f.view==='cal'?56:14)).length}</button></div></div>`;
  case 'group':return hd('Группировать по')+`<div class="sh-b">${Object.entries(GROUPS).map(([k,v])=>`<button class="opt ${f.group===k?'on':''}" data-a="sGroup" data-v="${k}"><span class="rd"></span><span class="ot"><b>${v}</b></span></button>`).join('')}</div>`;
  case 'sort':return hd('Сортировка')+`<div class="sh-b">${Object.entries(SORTS).map(([k,v])=>`<button class="opt ${f.sort===k?'on':''}" data-a="sSort" data-v="${k}"><span class="rd"></span><span class="ot"><b>${v}</b></span></button>`).join('')}</div>`;
  case 'book':{
    const x=instById(s.id);const t=x.t;const us=userState(x);const st0=t.month&&(x.permFree>0||us.offerP)?startInst(t):null;const canPerm=!!st0;const later=st0&&st0.id!==x.id;
    const opt=s.opt||'single';const bal=balanceH();const q=creditQuote(t);const extraPay=s.extra||'card';
    let method=s.method||'card';if(method==='credit'&&(!bal||opt==='perm'))method='card';
    const pb=st0?monthBill(t,uid(),st0.start.getFullYear(),st0.start.getMonth(),ymd(st0.start)):null;
    const amount=opt==='perm'?(pb?pb.amount:t.month):t.price;
    return hd('Запись на тренировку')+`<div class="sh-b">
      <div class="card" style="margin-bottom:14px"><b>${esc(t.title)}</b><div class="muted fs14">${longDay(x.start)}, ${hm(x.start)} · ${esc(coach(t.coach).short)}</div><div class="muted fs13 mt8">${ic('pin',14)} ${VENUE.full}, ${VENUE.addr} · ${esc(t.court)}</div></div>
      <div class="grp-h">Формат</div>
      <button class="opt ${opt==='single'?'on':''} ${x.left>0||us.offerS?'':'dis'}" data-a="bOpt" data-v="single"><span class="rd"></span><span class="ot"><b>Разовое посещение</b><p>${x.left>0||us.offerS?`Только ${dShort(x.start)}. Отмена бесплатно за 12 часов.`:`На ${dShort(x.start)} мест нет`}</p></span><span class="op">${eur(t.price)}</span></button>
      ${t.month?`<button class="opt ${opt==='perm'?'on':''} ${canPerm?'':'dis'}" data-a="bOpt" data-v="perm"><span class="rd"></span><span class="ot"><b>Постоянное место</b><p>${canPerm?`Место закреплено за вами ${WDA[t.weekday]} в ${t.time}. Оплата по календарным месяцам.`:'Все постоянные места заняты'}</p>${canPerm&&pb?`<p style="color:var(--text);margin-top:6px">${ic('card',14)} Сейчас — <b>€${fmtE(pb.amount)}</b> за ${pb.dates.length} ${plural(pb.dates.length,'занятие','занятия','занятий')}${pb.lateJoin&&pb.amount<t.month?` по разовой цене €${fmtE(t.price)}`:''} до конца ${MG[st0.start.getMonth()]} (${pb.dates.map(ds=>pYmd(ds).getDate()).join(', ')}), дальше €${fmtE(t.month)} за каждый месяц.</p>`:''}${canPerm?`<p style="color:var(--text);margin-top:6px">${ic('cal',14)} ${later?(()=>{const fb=fullBefore(t,st0,x.start);return `<b>На ${fb.map(z=>dShort(z.start)).join(', ')} мест нет — постоянное место можно занять с ${fromDay(st0.start)}.</b>${x.left>0?` На ${dShort(x.start)} можно записаться разово.`:''}`})():`Начало — <b>${longDay(st0.start).toLowerCase()}</b>`}</p>`:''}</span><span class="op">€${fmtE(t.month)}<small class="muted" style="font-weight:500;font-size:12px">/мес</small></span></button>`:''}

      <button class="opt ${method==='cash'?'on':''}" data-a="bMethod" data-v="cash"><span class="rd"></span><span class="ot"><b>Наличными на месте</b><p>${opt==='perm'?`Оплата за месяц тренеру или администратору на первом занятии${st0?` (${dShort(st0.start)})`:''}`:'Оплата тренеру перед началом занятия'}</p></span>${ic('cash',22)}</button>`:''}
      <button class="btn pri mt16" data-a="bConfirm">${amount===0?'Записаться бесплатно':method==='credit'?(q.extra?(extraPay==='cash'?`Списать ${fmtH(q.useH)} · €${fmtE(q.extra)} на месте`:`Списать ${fmtH(q.useH)} и доплатить €${fmtE(q.extra)}`):`Записаться · списать ${fmtH(q.useH)}`):method==='cash'?(opt==='perm'?`Занять место · €${fmtE(amount)} на месте`:`Записаться · ${eur(amount)} на месте`):`Перейти к оплате · €${fmtE(amount)}${opt==='perm'?'/мес':''}`}</button></div>`;}
  case 'pay':return hd('Оплата')+`<div class="sh-b">
      <div class="card" style="text-align:center"><div class="muted fs14">${esc(s.title)}</div><div style="font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:4px">€${fmtE(s.amount)}</div>${s.sub?`<div class="fs13 muted">${esc(s.sub)}</div>`:''}</div>

  case 'lang':return hd('Язык')+`<div class="sh-b">${[['lv','🇱🇻','Latviešu'],['ru','🇷🇺','Русский'],['en','🇬🇧','English']].map(([k,f,n])=>`<button class="lang ${k==='ru'?'on':''}" data-a="langPick" data-k="${k}"><span class="fl">${f}</span>${n}${k==='ru'?`<span class="ck">${ic('check',22)}</span>`:''}</button>`).join('')}<div class="small-note">В прототипе показан русский интерфейс. В приложении будут все 3 языка, включая уведомления и чеки.</div></div>`;

const CONCEPT=`
<p><b>Цель первого релиза:</b> игрок Tenly сам находит тренировку своей группы, записывается и платит за минуту; школа меньше занимается перепиской и контролем оплат.</p>
<p><b>Где:</b> теннисный клуб Enri, Kalnciema iela 207, Рига — адрес и маршрут в карточке каждой тренировки.</p>
<h5>Роли</h5><ul><li><b>Игрок</b> — запись, абонементы, оплата. Скоро: профили детей в одном аккаунте.</li><li><b>Тренер</b> (Анастасия, Олег) — только свои занятия: участники, посещаемость, наличные, предложение уровня.</li><li><b>Администратор</b> — всё расписание и состав каждого занятия, игроки, скрытый рейтинг, команда.</li></ul>
<h5>Новый пользователь</h5><ul><li>Язык: LV / RU / EN → регистрация (телефон + SMS, Apple, Google).</li><li>Тест из 7 вопросов → NTRP 1.0–5.0 с шагом 0.5.</li><li>Расписание сразу отфильтровано по группе игрока.</li></ul>
<h5>4 группы по уровню</h5><ul><li>Новички без опыта — NTRP 1.0–1.5</li><li>Новички до года — NTRP 2.0–2.5</li><li>Средний уровень — NTRP 3.0–3.5</li><li>Продвинутые любители — NTRP 4.0–5.0</li></ul>
<h5>Уровень и доступ</h5><ul><li>Админ может задать <b>скрытый рейтинг</b>: игрок видит свой результат теста, а доступ считается по скрытому.</li><li>Тренер предлагает изменение — админ подтверждает. Игрок может запросить допуск в группу выше.</li></ul>
<h5>Запись и оплата</h5><ul><li>Игрок видит только, есть ли место — без списка участников и счётчиков. Состав видят тренер и администратор.</li><li><b>Разово</b>: €30 за час, €45 за 1,5 часа — картой в приложении или наличными на месте.</li><li><b>Постоянное место</b> (если есть в группе) — раз в месяц, картой в приложении или наличными на месте. Если ближайшее занятие заполнено, игрок сразу видит, с какой даты начнёт ходить.</li><li>Цены задаёт администратор («Тренировки» → «Цены»): разово и абонемент для 60 и 90 минут, с применением ко всем группам.</li><li>За 3 дня до даты оплаты на главной появляется сумма и кнопка «Оплатить».</li><li>«Не приду» освобождает место для разовой записи.</li></ul>
<h5>Отыгрыши (в часах)</h5><ul><li>Оплатил и отменил не позднее чем за 12 часов (разовая запись или «Не приду» в своей группе) → длительность занятия возвращается на баланс: +1 ч или +1,5 ч.</li><li>Часы действуют 60 дней и списываются при записи. Не хватает — остаток доплачивается картой сразу или наличными на месте (€30 за час).</li><li>Если занятие отменяет школа — часы получают все оплатившие. Админ может начислить часы вручную.</li></ul>
<h5>Счета</h5><ul><li>После каждой оплаты (карта, абонемент, наличные у тренера) клиенту доступен счёт: номер, дата, услуга, сумма, способ оплаты, списанные часы отыгрыша. PDF и отправка на e-mail.</li><li>Наличные: счёт создаётся при записи и отмечается оплаченным, когда тренер или администратор подтверждает получение денег.</li><li>У администратора отдельная вкладка «Оплаты»: кто и сколько не оплатил, все полученные оплаты с фильтром по способу (в приложении, наличные, карта в клубе, перевод) и итоги месяца. Кнопка «Принять» — внести оплату, сделанную в клубе.</li><li>Администратор видит список «Ожидают оплаты» (разовые на месте, доплаты, абонементы) и отмечает оплату наличными, переводом или картой в клубе — у игрока пропадает напоминание и появляется счёт.</li></ul>
<h5>Заморозка места</h5><ul><li>По просьбе ученика (отпуск, травма) админ замораживает место в группе на выбранные даты: начало и окончание (быстрый выбор — 2 недели, месяц, 2 месяца; максимум 90 дней).</li><li>За период заморозки абонемент не списывается; место остаётся за учеником, после возвращения он продолжает ходить в группу.</li><li>Пока ученика нет, его место открыто для разовой записи других игроков.</li><li>Ученик может отправить запрос на заморозку прямо из приложения.</li></ul>
<h5>Уведомления и мероприятия</h5><ul><li>Админ отправляет push всем, по уровням или игрокам конкретного тренера: информацию, свободное место с кнопкой «Записаться» или мероприятие с кнопками «Буду / Не смогу» и счётчиком ответов.</li><li>Нерабочие дни (день или период): тренировки отменяются автоматически, игроки получают уведомление, оплаченные занятия переходят в отыгрыши.</li><li>Лист ожидания на разовое занятие и на постоянное место; при освобождении — уведомление, место держится 2 часа.</li></ul>
<h5>Расписание</h5><ul><li>Список и календарь.</li><li>Группировка: день, тренер, уровень группы, длительность, время суток.</li><li>Сортировка и фильтры по тренеру, уровню, длительности, времени.</li></ul>
<h5>Дальше</h5><ul><li>Профили детей, лист ожидания с push, отчёты для админа.</li><li>Android: общий кроссплатформенный код (React Native или Flutter) — один код на iOS и Android.</li><li>Платежи: Stripe / Montonio, Apple Pay и Google Pay.</li></ul>`;

    S.stack.pop();S.anim='pop';toast(`${ch?`Уровень NTRP ${fmtR(p.self)} сохранён, игрок уведомлён. `:''}${d.on?`Скрытый рейтинг ${fmtR(d.v)}`:'Скрытого рейтинга нет'}`)},
  fbSend:async()=>{const t=document.getElementById('fbText').value.trim();if(!t){toast('Напишите пару слов');return}
    const text=`Отзыв о прототипе Tenly\nЭкран: ${screenName()} (${ROLES.find(r=>r[0]===S.role)[1]})\n\n${t}`;
    try{if(navigator.share&&innerWidth<=600){await navigator.share({text});S.sheet=null;toast('Спасибо за отзыв!');return}}catch(_){}
    try{await navigator.clipboard.writeText(text);S.sheet=null;toast('Текст скопирован — отправьте его нам в мессенджере')}catch(_){S.sheet=null;toast('Не удалось скопировать — пришлите текст вручную')}},
};
/* invoice in Tenly's format (Latvian, prices include PVN 21%) */
const SUPPLIER={name:'SIA TENLY',addr:'Rīgas iela ••-••, Jūrmala, LV-2015',reg:'4020•••••09',pvn:'LV4020•••••09',iban:'LV54 UNLA •••• •••• ••27',bank:'AS SEB Banka',swift:'UNLALV2X',phone:'+371 2217••••'};
const money=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const net=g=>Math.round(g/1.21*100)/100;
function lvWords(n){const u=['nulle','viens','divi','trīs','četri','pieci','seši','septiņi','astoņi','deviņi'];
  const teen=['desmit','vienpadsmit','divpadsmit','trīspadsmit','četrpadsmit','piecpadsmit','sešpadsmit','septiņpadsmit','astoņpadsmit','deviņpadsmit'];
  const tens=['','','divdesmit','trīsdesmit','četrdesmit','piecdesmit','sešdesmit','septiņdesmit','astoņdesmit','deviņdesmit'];
  const l100=n=>n<10?u[n]:n<20?teen[n-10]:tens[Math.floor(n/10)]+(n%10?' '+u[n%10]:'');
  const l1000=n=>{const h=Math.floor(n/100),r=n%100;let s=h?(h===1?'viens simts':u[h]+' simti'):'';if(r||!s)s+=(s?' ':'')+l100(r);return s};
  if(n<1000)return l1000(n);const th=Math.floor(n/1000),r=n%1000;return (th===1?'viens tūkstotis':l1000(th)+' tūkstoši')+(r?' '+l1000(r):'')}
const sumWords=a=>{const e=Math.floor(a+1e-9),c=Math.round((a-e)*100);const w=lvWords(e);return w[0].toUpperCase()+w.slice(1)+` eiro un ${String(c).padStart(2,'0')} centi`};
const lvPay=m=>m==='Наличные'?'Skaidra nauda':m==='Наличные на месте'?'Skaidra nauda (uz vietas)':m==='Карта в клубе'?'Maksājumu karte (klubā)':m==='Банковский перевод'?'Pārskaitījums':m==='Часы отыгрыша'?'Atgūšanas stundas':'Maksājumu karte';
function affectedBy(from,to){const days=Math.max(0,Math.round((pYmd(to)-T0)/DAY))+1;return instancesRange(days).filter(x=>{const ds=ymd(x.start);return ds>=from&&ds<=to})}
/* cancel one session: paid members (month paid) and paid single bookings get hours back; everyone is notified */
function cancelSessionEffects(x,why,title,text){const ppl=participants(x).map(p=>p.id);
  x.t.members.forEach(u=>{if(!memOn(x.t,u,ymd(x.start))||frozenUids(x.t,ymd(x.start)).includes(u)||D.absences.some(a=>a.inst===x.id&&a.uid===u))return;
    if(abonPaid(u,x.t.id,x.start.getFullYear(),x.start.getMonth()))addCredit(x,u,why)});
  x.singles.forEach(b=>{const ph=paidHours(x,b);refundAlloc(b.alloc);const money=ph-(b.useH||0);if(money>0)addCredit(x,b.uid,why,money);b.cancelled=true;const inv=invOfBooking(b);if(inv){if(!inv.paid)inv.cancelled=true;else inv.refundH=ph}});
  D.waitlist=D.waitlist.filter(w=>!(w.type==='single'&&w.ref===x.id));
  if(ppl.length)sendMsg({by:'admin',kind:'closed',title,text,toUids:ppl,aud:'Участники занятия'});return ppl}
/* delete a user: cancels future bookings, leaves groups & waitlists, credits expire; invoices stay for accounting */
function removeUser(pid){const p=player(pid);const now=new Date();let nB=0,nG=0;
  D.bookings.forEach(b=>{if(b.uid!==pid||b.cancelled)return;const x=instById(b.inst);if(!x||x.start<now)return;b.cancelled=true;nB++;const inv=invOfBooking(b);if(inv&&!inv.paid)inv.cancelled=true});
  D.tpls.forEach(t=>{if(t.members.includes(pid)){t.members=t.members.filter(u=>u!==pid);nG++}});
  D.memberships=D.memberships.filter(m=>m.uid!==pid);D.waitlist=D.waitlist.filter(w=>w.uid!==pid);D.freezes=D.freezes.filter(f=>f.uid!==pid);D.requests=D.requests.filter(r=>r.pid!==pid);D.debts=D.debts.filter(d=>d.pid!==pid);
  const h=balanceH(pid);D.credits.forEach(c=>{if(c.uid===pid)c.left=0});p.deleted=true;p.deletedAt=ymd(T0);p.pk='';p.phone='';return{nB,nG,h}}
function userImpact(pid){const now=new Date();return{nB:D.bookings.filter(b=>b.uid===pid&&!b.cancelled&&(instById(b.inst)||{start:0}).start>now).length,groups:D.tpls.filter(t=>!t.deleted&&t.members.includes(pid)),nW:D.waitlist.filter(w=>w.uid===pid).length,h:balanceH(pid)}}
function renewInvoice(ri,method,extra={}){const t=ri.t;const y=ri.due.getFullYear(),mo=ri.due.getMonth();
  return addInvoice({uid:'p1',kind:'abon',title:`Абонемент за ${ri.month}: ${t.title}`,sessions:ri.bill.active,period:{from:ymd(new Date(y,mo,1)),to:ymd(new Date(y,mo+1,0))},
    lines:[{name:`Абонемент «${t.title}» за ${ri.month}`,detail:ri.bill.active.map(ds=>dShort(pYmd(ds))).join(', '),sum:ri.amount}],amount:ri.amount,method,...extra})}
/* value of a single booking that was actually paid, in hours (card, cash already received, credit hours + paid top-up) */
function paidHours(x,b){if(!b)return 0;const need=x.t.dur/60;
  if(b.pay==='card')return need;
  if(b.pay==='cash')return D.cashGot[b.id]?need:0;
  if(b.pay==='credit')return (b.useH||0)+(b.extra&&(b.extraPay==='card'||D.cashGot[b.id])?need-(b.useH||0):0);
  return 0}
function refundHours(x,b){return b&&earlyEnough(x)?paidHours(x,b):0} // hours back to the balance on an early cancel
/* paid subscription sessions of a member from a date on (current and prepaid months), not frozen/closed/already refunded */
function paidSessionsFrom(t,u,fromDs){let n=0;const d0=pYmd(fromDs);const fz=D.freezes.filter(f=>f.tpl===t.id&&f.uid===u);
  for(let k=0;k<4;k++){const dt=new Date(d0.getFullYear(),d0.getMonth()+k,1);if(!abonPaid(u,t.id,dt.getFullYear(),dt.getMonth()))continue;
    n+=monthDates(t,dt.getFullYear(),dt.getMonth(),fromDs).filter(ds=>!isClosed(ds)&&!fz.some(f=>ds>=f.from&&ds<=f.to)&&!D.absences.some(a=>a.uid===u&&a.inst===t.id+'_'+ds)).length}
  return n}
/* a new permanent member: single bookings in the same group from the start date are absorbed by the subscription */
function absorbSingles(t,u,sinceDs){let h=0,n=0;D.bookings.filter(b=>b.uid===u&&!b.cancelled&&b.inst.startsWith(t.id+'_')&&b.inst.split('_')[1]>=sinceDs).forEach(b=>{const x=instById(b.inst);if(!x)return;
    refundAlloc(b.alloc);const money=paidHours(x,b)-(b.useH||0);if(money>0)addCredit(x,u,'Вошло в абонемент',money);h+=paidHours(x,b);n++;b.cancelled=true;const inv=invOfBooking(b);if(inv){if(!inv.paid)inv.cancelled=true;else inv.refundH=paidHours(x,b)}});
  return{h,n}}
function doBook(x,opt,pay,o={}){
  const t=x.t;const m=o.method||'Карта •••• 4242';
  if(opt==='perm'){const st0=startInst(t)||x;const sinceDs=ymd(st0.start);const cash=pay==='cash';
    t.members.push(uid());t.since=t.since||{};t.since[uid()]=sinceDs;const abs=absorbSingles(t,uid(),sinceDs);
    D.waitlist=D.waitlist.filter(w=>!(w.uid===uid()&&(w.type==='perm'&&w.ref===t.id||w.type==='single'&&w.ref.startsWith(t.id+'_'))));
    staffMsg([t.coach,'a1'],'Новый постоянный игрок',`${me().name} занял(а) постоянное место в «${t.title}» с ${dShort(st0.start)} · ${cash?'оплата на месте':'оплачено в приложении'}.`);
    const pb=monthBill(t,uid(),st0.start.getFullYear(),st0.start.getMonth(),sinceDs);const mo=st0.start.getMonth(),yy=st0.start.getFullYear();
    const inv=addInvoice({kind:'abon',title:`Абонемент за ${MN[mo].toLowerCase()}: ${t.title}`,sessions:pb.dates,period:{from:sinceDs,to:ymd(new Date(yy,mo+1,0))},lines:[{name:`Постоянное место «${t.title}» до конца ${MG[mo]}`,detail:pb.dates.map(ds=>dShort(pYmd(ds))).join(', '),sum:pb.amount}],amount:pb.amount,method:cash?'Наличные на месте':m,paid:!cash});
    D.memberships.push({tpl:t.id,uid:uid(),since:sinceDs,pay:cash?'cash':'card',paid:!cash,inv:inv.id,firstAmount:pb.amount});if(!cash)setAbonPaid(uid(),t.id,yy,mo,inv.id);
    openSheet('success',{title:'Место за вами!',text:`Постоянное место в «${esc(t.title)}» — ${WDA[t.weekday]} в ${t.time}. <b>Первое занятие — ${longDay(st0.start).toLowerCase()}</b>${st0.id!==x.id?` (на ${dShort(x.start)} мест не было)`:''}. ${cash?`Оплата €${fmtE(pb.amount)} за ${MN[st0.start.getMonth()].toLowerCase()} (${pb.dates.length} ${plural(pb.dates.length,'занятие','занятия','занятий')}) наличными на первом занятии.`:`Оплачено €${fmtE(pb.amount)} за ${pb.dates.length} ${plural(pb.dates.length,'занятие','занятия','занятий')} до конца ${MG[st0.start.getMonth()]}.`} Дальше — €${fmtE(t.month)} за каждый календарный месяц, оплата до 1-го числа.${abs.n?` Ваша разовая запись в эту группу вошла в абонемент${abs.h?` — ${fmtH(abs.h)} возвращены на баланс отыгрышей`:''}.`:''}`,inv:inv.id});return}
  D.waitlist=D.waitlist.filter(w=>!(w.uid===uid()&&w.type==='single'&&w.ref===x.id));
  staffMsg([t.coach],'Новая запись',`${me().name}: «${t.title}», ${fromDay(x.start)} в ${hm(x.start)} · ${pay==='cash'?'оплата на месте':pay==='credit'?'часами отыгрыша':'оплачено в приложении'}.`);
  const b={id:'b'+Date.now(),inst:x.id,uid:uid(),pay};
  const line={name:`Разовая тренировка «${t.title}»`,detail:`${longDay(x.start)}, ${hm(x.start)} · ${t.dur} мин · ${VENUE.name}, ${t.court}`,sum:t.price};
  let inv=null,txt='';
  if(pay==='credit'){b.useH=o.useH;b.alloc=spendHours(o.useH);b.extra=o.extra||0;b.extraPay=o.extraPay||null;
    inv=addInvoice({title:`Разовое: ${t.title}`,bid:b.id,kind:'single',sessions:[ymd(x.start)],lines:[line],creditH:o.useH,creditSum:t.price-b.extra,amount:b.extra,method:b.extra?(b.extraPay==='cash'?'Наличные на месте':m):'Часы отыгрыша',paid:b.extraPay!=='cash'});
    txt=`Списано ${fmtH(o.useH)} отыгрыша${b.extra?(b.extraPay==='cash'?`, доплата €${fmtE(b.extra)} наличными тренеру на месте`:`, доплачено €${fmtE(b.extra)} картой`):''}. Остаток на балансе: ${fmtH(balanceH())}.`}
  else if(pay==='cash'){inv=addInvoice({title:`Разовое: ${t.title}`,bid:b.id,kind:'single',sessions:[ymd(x.start)],lines:[line],amount:t.price,method:'Наличные на месте',paid:false});txt=`Оплата €${fmtE(t.price)} наличными тренеру на месте — выдадут кассовый чек.`}
  else if(pay==='free')txt='Ракетку и мячи выдадим.';
  else{inv=addInvoice({title:`Разовое: ${t.title}`,bid:b.id,kind:'single',sessions:[ymd(x.start)],lines:[line],amount:t.price,method:m});txt=`Оплачено картой, счёт № ${inv.no}.`}
  D.bookings.push(b);
  openSheet('success',{title:'Вы записаны!',text:`${esc(t.title)} — ${relDay(x.start).toLowerCase()}, ${hm(x.start)}. ${txt}`,inv:inv&&inv.id});
}
function createNewUser(){
  if(S.newUid&&player(S.newUid))return;
  S.newUid='pNew';D.players.push({id:'pNew',name:S.ob.name||'Алекс Новиков',self:2.0,hidden:null,phone:S.ob.phone&&S.ob.phone.length>6?S.ob.phone:'+371 2••• 7781'});
}
function setRole(r){
  S.role=r;S.sheet=null;S.anim=null;S.ob=null;S.scroll={};
  const first={new:'home',player:'home',coach:'cSessions',admin:'aHome'}[r];
  S.stack=[{n:r==='new'&&S.reg?'schedule':first}];
  if(r==='new'&&!S.reg)S.ob={step:'lang',lang:'ru',ans:[],q:0};
  if(r==='new'&&S.reg)S.stack=[{n:'home'}];
  render();
}

/* back navigation: swipe right on a screen (iOS edge-swipe style), swipe down on a sheet, Esc on desktop */
function backTarget(){if(S.sheet)return'sheet';return document.querySelector('.view .navbar .back')}
function goBack(){const b=backTarget();if(b==='sheet')closeSheet();else if(b)b.click()}
let SW=null;
root.addEventListener('touchstart',e=>{if(e.touches.length>1)return;const t=e.touches[0];const scr=document.querySelector('.screen');if(!scr)return;
  if(e.target.closest('.chips,.hs,input,textarea,select'))return;
  const inSheet=!!e.target.closest('.sheet');const sb=inSheet&&e.target.closest('.sh-b');
  SW={x0:t.clientX,y0:t.clientY,dx:0,dy:0,lock:null,inSheet,sheetTop:!sb||sb.scrollTop<=0}},{passive:true});
root.addEventListener('touchmove',e=>{if(!SW)return;const t=e.touches[0];SW.dx=t.clientX-SW.x0;SW.dy=t.clientY-SW.y0;
  if(!SW.lock&&(Math.abs(SW.dx)>12||Math.abs(SW.dy)>12)){
    if(SW.inSheet)SW.lock=SW.dy>0&&SW.sheetTop&&Math.abs(SW.dy)>Math.abs(SW.dx)?'down':'none';
    else SW.lock=!S.sheet&&SW.dx>0&&Math.abs(SW.dx)>Math.abs(SW.dy)*1.4&&backTarget()?'right':'none'}
  if(SW.lock==='right'){const v=document.querySelector('.view');if(v){v.style.transition='none';v.style.transform=`translateX(${Math.max(0,SW.dx)}px)`;v.style.boxShadow='-8px 0 24px rgba(0,0,0,.12)'}}
  if(SW.lock==='down'){const sh=document.querySelector('.sheet');if(sh){sh.style.transition='none';sh.style.transform=`translateY(${Math.max(0,SW.dy)}px)`}}},{passive:true});
root.addEventListener('touchend',()=>{if(!SW)return;const s=SW;SW=null;
  if(s.lock==='right'&&s.dx>80){goBack();return}
  if(s.lock==='down'&&s.dy>90){closeSheet();return}
  document.querySelectorAll('.view,.sheet').forEach(el=>{el.style.transition='transform .2s';el.style.transform='';el.style.boxShadow=''})});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.target.closest('input,textarea'))goBack()});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(fn){e.preventDefault();const c=AUD[el.dataset.a]?audCtx(el):null;fn(el);if(c){audAfter(el.dataset.a,c);if(!S.toast)render()}}
});
setInterval(()=>{const sb=document.querySelector('.statusbar span');if(sb)sb.textContent=hm(new Date())},20000);
render();
</script>
